# Keeps the workflows' actions current. Package and backend updates are done by
# hand: the catalog in package.json and BACKEND_IMAGE in images/Dockerfile
# change together with a `bun run e2e` run.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
