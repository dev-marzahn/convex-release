# Pushing a tag v<version> releases that version: CI runs first, then the four
# base images go to ghcr.io for amd64 and arm64, then the package goes to npm.
# Images go first because `init --docker` points apps at the image tag of the
# package version they install.
#
# The images and npm jobs run in the `release` environment, which only accepts
# runs from v* tags and main. Only people with write access can push a tag or
# start a run by hand. npm publishes through trusted publishing (OIDC): the
# package's npm settings name this workflow and that environment, so no token
# is stored anywhere. The workflow only stages the version: it goes live when a
# maintainer approves it with 2FA.
#
# A prerelease (v100.1.0-next.0, any version with a `-`) publishes under its
# version only: the images skip the latest and runtime tags, and npm puts it on
# the `next` dist-tag instead of `latest`.
name: Release

on:
  push:
    tags: ['v*']
  # Re-runs a tag's release with this branch's workflow, for when the tag's own
  # run failed in the workflow itself. Every job still builds the tag's code.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, like v100.0.0
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Tag matches the package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(node -p "require('./packages/convex-release/package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match packages/convex-release/package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  images:
    name: Images
    needs: [version, ci]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Every image carries Convex backend code (FSL-1.1-Apache-2.0): the
          # combined ones the whole backend, the one-shot ones its key generator.
          for target in combined combined-runtime oneshot oneshot-runtime; do
            case $target in
              combined) name=convex-release suffix= ;;
              combined-runtime) name=convex-release suffix=-runtime ;;
              oneshot) name=convex-release-oneshot suffix= ;;
              oneshot-runtime) name=convex-release-oneshot suffix=-runtime ;;
            esac
            tags=(-t "ghcr.io/dev-marzahn/$name:$VERSION$suffix")
            # A prerelease (100.1.0-next.0) doesn't move latest or runtime.
            if [[ "$VERSION" != *-* ]]; then
              latest=latest
              [ -n "$suffix" ] && latest=runtime
              tags+=(-t "ghcr.io/dev-marzahn/$name:$latest")
            fi
            docker buildx build . -f images/Dockerfile --target "$target" --push \
              --platform linux/amd64,linux/arm64 \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.version=$VERSION" \
              --label "org.opencontainers.image.licenses=MPL-2.0 AND FSL-1.1-Apache-2.0" \
              "${tags[@]}"
          done

  npm:
    name: npm
    needs: [version, images]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build
      # bun pm pack replaces the catalog: ranges with real ones; npm publish wouldn't.
      - name: Pack
        working-directory: packages/convex-release
        run: bun pm pack --destination "$RUNNER_TEMP" --quiet
      # Outside the repo: its devEngines names Bun, and npm refuses to run under it.
      # npm only accepts provenance from public repos.
      - name: Publish
        working-directory: ${{ runner.temp }}
        env:
          PROVENANCE: ${{ github.event.repository.private && '--no-provenance' || '--provenance' }}
          VERSION: ${{ needs.version.outputs.version }}
        # Stages the version; it goes live once a maintainer approves it with 2FA
        # under Staged Packages on npmjs.com, or with `npm stage approve <id>`.
        # A prerelease goes to the `next` dist-tag, so `latest` stays stable.
        run: |
          tag=latest
          [[ "$VERSION" == *-* ]] && tag=next
          npm stage publish ./*.tgz "$PROVENANCE" --access public --tag "$tag"
