# Pushing a tag v<version> releases that version: CI runs first, then the four
# base images go to ghcr.io for amd64 and arm64, then the package goes to npm.
# Images go first because `init --docker` points apps at the image tag of the
# package version they install.
#
# Needs an NPM_TOKEN secret with publish rights to @dev-marzahn/convex-release.
name: Release

on:
  push:
    tags: ['v*']
  # Re-runs a tag's release with this branch's workflow, for when the tag's own
  # run failed in the workflow itself. Every job still builds the tag's code.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, like v100.0.0
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Tag matches the package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(node -p "require('./packages/convex-release/package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match packages/convex-release/package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  images:
    name: Images
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for target in combined combined-runtime oneshot oneshot-runtime; do
            case $target in
              combined) name=convex-release suffix= ;;
              combined-runtime) name=convex-release suffix=-runtime ;;
              oneshot) name=convex-release-oneshot suffix= ;;
              oneshot-runtime) name=convex-release-oneshot suffix=-runtime ;;
            esac
            latest=latest
            [ -n "$suffix" ] && latest=runtime
            docker buildx build . -f images/Dockerfile --target "$target" --push \
              --platform linux/amd64,linux/arm64 \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.version=$VERSION" \
              --label "org.opencontainers.image.licenses=MIT" \
              -t "ghcr.io/dev-marzahn/$name:$VERSION$suffix" \
              -t "ghcr.io/dev-marzahn/$name:$latest"
          done

  npm:
    name: npm
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build
      # bun pm pack replaces the catalog: ranges with real ones; npm publish wouldn't.
      - name: Pack
        working-directory: packages/convex-release
        run: bun pm pack --destination "$RUNNER_TEMP" --quiet
      # Outside the repo: its devEngines names Bun, and npm refuses to run under it.
      # npm only accepts provenance from public repos.
      - name: Publish
        working-directory: ${{ runner.temp }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PROVENANCE: ${{ github.event.repository.private && '--no-provenance' || '--provenance' }}
        run: npm publish ./*.tgz "$PROVENANCE" --access public
